<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intellexa | Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a; /* dark slate */
      color: #e5e7eb;
      display: flex;
      min-height: 100vh;
    }

    /* Top Navbar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: #020617;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .nav {
      display: flex;
      flex-direction: row;
      gap: 18px;
    }

    .nav a {
      text-decoration: none;
      color: #cbd5f5;
      padding: 10px 14px;
      border-radius: 10px;
      transition: 0.3s ease;
      font-weight: 500;
    }

    .nav a:hover {
      background: #1e293b;
      color: #38bdf8;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 120px 32px 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .profile {
      display: flex;
      align-items: center;
      margin-left: 20px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #020617;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      background: #020617;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card h3 {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 1.6rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Section */
    .section {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
    }

    .section h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 14px 10px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.95rem;
    }

    th {
      color: #94a3b8;
      font-weight: 600;
    }

    td {
      color: #e5e7eb;
    }

    @media(max-width: 768px) {
      .nav {
        display: none;
      }
    }
    }
  </style>
  <style>
    canvas#bg {
      position: fixed;
      inset: 0;
      z-index: -1;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
</head>
<body>
  <canvas id="bg"></canvas>

  <aside class="sidebar">
    <div class="club-name">Intellexa</div>
    <nav class="nav">
      <a href="#">Dashboard</a>
      <a href="#">Events</a>
      <a href="#">Attendance</a>
      <a href="#">Resources</a>
      <a href="#">Profile</a>
      <a href="#">Logout</a>
    </nav>
    <div class="profile">
      <div class="avatar">S</div>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Welcome back, Student 👋</h1>
    </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Total Events</h3>
        <p>12</p>
      </div>
      <div class="card">
        <h3>Events Attended</h3>
        <p>8</p>
      </div>
      <div class="card">
        <h3>Attendance</h3>
        <p>66%</p>
      </div>
      <div class="card">
        <h3>Certificates</h3>
        <p>3</p>
      </div>
    </div>

    <div class="section">
      <h2>Upcoming Events</h2>
      <table>
        <thead>
          <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Web Dev Bootcamp</td>
            <td>15 Feb 2026</td>
            <td>Registered</td>
          </tr>
          <tr>
            <td>AI Awareness Session</td>
            <td>28 Feb 2026</td>
            <td>Open</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // ===== THREE.JS BACKGROUND =====
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('#bg'),
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.z = 30;

    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particleCount = 800;

    const posArray = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 200;
    }

    particlesGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(posArray, 3)
    );

    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.6,
      color: 0x38bdf8
    });

    const particlesMesh = new THREE.Points(
      particlesGeometry,
      particlesMaterial
    );

    scene.add(particlesMesh);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.y += 0.0006;
      particlesMesh.rotation.x += 0.0003;
      renderer.render(scene, camera);
    }

    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
